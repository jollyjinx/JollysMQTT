name: Release notarized macOS DMG

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jollyjinx/JollysMQTT'
    runs-on: macos-26
    timeout-minutes: 120
    environment: macos-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version

      - name: Validate release tag and scripts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 Scripts/release_macos_dmg.py --tag "$RELEASE_TAG" --validate-tag
          python3 -B -m unittest discover -s Scripts/Tests -p 'test_macos_release.py' -v

      - name: Build and test package
        working-directory: JollysMQTTPackage
        run: |
          swift build
          swift test --parallel

      - name: Build, sign, and notarize DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 Scripts/release_macos_dmg.py --tag "$RELEASE_TAG" --output-dir "$RUNNER_TEMP/macos-release"

      - name: Save verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-dmg
          path: ${{ runner.temp }}/macos-release/assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save notarization reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notarization-reports
          path: ${{ runner.temp }}/macos-release/notary/*.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-dmg
          path: dist

      - name: Verify checksum and publish GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.dmg SHA256SUMS --verify-tag --generate-notes --title "JollysMQTT $RELEASE_TAG"
